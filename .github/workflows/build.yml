name: build

# A push to main builds and releases only when the package version has no matching v* tag yet, so a
# release is a version bump and nothing else. Pull requests build without releasing; a manual dispatch
# builds without releasing unless it runs on a tag. A v* tag pushed by hand still builds and releases.
# Everything that ships goes through the gate: a build (and therefore a release) is only attempted
# after the whole ci pipeline (ruff, format, mypy, vulture, deptry and pytest with the 100%
# branch-coverage gate on a 3-OS x 3-Python matrix) AND the Linux memory-regression benchmarks pass
# on this commit. Any failed leg or benchmark skips the build and the release entirely. When the
# version did not change the whole gate is skipped (nothing ships) and this push relies on ci.yml.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "autoclip/**"
      - "tools/**"
      - "assets/**"
      - "autoclip.spec"
      - "snapcraft.yaml"
      - ".github/workflows/build.yml"
      - "pyproject.toml"
      - "install.sh"
      - "install.ps1"

concurrency:
  group: build-${{ github.ref }}
  # a new pull request run replaces the old one; pushes to main queue, so the next run sees the new tag
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read

# PyInstaller cannot cross-compile, so every target is built on a runner of that architecture:
# ubuntu-24.04-arm and macos-15 are the arm64 runners and macos-15-intel is the x64 one
# (macos-13 and macos-14 are on their way out). Windows on ARM is not built: ctranslate2
# (faster-whisper) publishes no win-arm64 wheels and opencv has none either.
jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.version.outputs.build }}
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read and check the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" != "$PACKAGE" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml ($PACKAGE)"
              exit 1
            fi
          else
            VERSION="$PACKAGE"
          fi
          if ! grep -Fqx "__version__ = \"$VERSION\"" autoclip/__init__.py; then
            echo "::error file=autoclip/__init__.py::__version__ does not match pyproject.toml ($VERSION)"
            exit 1
          fi
          if ! grep -Fqx "version: \"$VERSION\"" snapcraft.yaml; then
            echo "::error file=snapcraft.yaml::version does not match pyproject.toml ($VERSION)"
            exit 1
          fi

          EXISTS=false
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
              EXISTS=true
            fi
          fi

          case "${{ github.event_name }}" in
            pull_request|workflow_dispatch)
              BUILD=true
              if [ "${{ github.ref_type }}" = "tag" ]; then RELEASE=true; else RELEASE=false; fi
              ;;
            push)
              if [ "${{ github.ref_type }}" = "tag" ]; then
                BUILD=true
                RELEASE=true
              else
                if [ "$EXISTS" = true ]; then BUILD=false; else BUILD=true; fi
                RELEASE="$BUILD"
              fi
              ;;
            *)
              echo "::error::unexpected event ${{ github.event_name }}"
              exit 1
              ;;
          esac

          echo "version $VERSION: build=$BUILD release=$RELEASE (tag exists: $EXISTS)"
          {
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "release=$RELEASE"
          } >> "$GITHUB_OUTPUT"
      - name: Note the skipped gate
        if: steps.version.outputs.build != 'true'
        shell: bash
        run: echo "::notice::version unchanged on ${{ github.ref }}; the full ci gate is left to ci.yml (no release will be attempted)"

  # The release path is gated on the WHOLE ci pipeline: every OS x Python leg must be green
  # (lint, types, dead code/deps, pytest with the 100% branch-coverage gate) before any
  # build starts; these jobs mirror ci.yml exactly (keep them in sync).
  ci:
    name: ci (${{ matrix.os }}, ${{ matrix.python }})
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      # No step is ever skipped: everything runs even after a failure so nothing fails silently.
      - uses: actions/checkout@v4
        if: always()
      - uses: actions/setup-python@v5
        if: always()
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package
        if: always()
        run: pip install -e ".[dev]"
      - name: Lint
        if: always()
        run: ruff check . && ruff format --check .
      - name: Type-check
        if: always()
        run: mypy autoclip tests tools
      - name: Dead code and dependency hygiene
        if: always()
        run: vulture && deptry .
      # the desktop app tests need a display; Linux uses a virtual one (macOS and Windows have one)
      - name: Install a virtual display
        if: always()
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y xvfb
          else
            echo "no virtual display needed on ${{ runner.os }}; using the runner's own display"
          fi
      - name: Test
        if: always()
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a pytest
          else
            pytest
          fi
      - name: Re-run with the security-patched Pillow (MoviePy's own pin is merely conservative)
        if: always()
        shell: bash
        run: |
          pip install "Pillow>=12.3"
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a pytest
          else
            pytest
          fi

  # Linux-only memory-regression benchmarks; the matrix legs enforce the rest of the pipeline.
  memory:
    name: memory-regression
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Memory-regression benchmarks
        run: env AUTOCLIP_MEMORY_TESTS=1 pytest tests/memory --no-cov

  build:
    name: ${{ matrix.name }}
    needs: [check, ci, memory]
    if: needs.check.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            artifact: autoclip-linux-x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            artifact: autoclip-linux-arm64
          - name: macos-x64
            os: macos-15-intel
            artifact: autoclip-macos-x64
          - name: macos-arm64
            os: macos-15
            artifact: autoclip-macos-arm64
          - name: windows-x64
            os: windows-2022
            artifact: autoclip-windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server]" "pyinstaller>=6.10"
      - name: Build the standalone app
        env:
          # a release build must contain the server pages: the spec re-raises when they are missing
          AUTOCLIP_REQUIRE_SERVER: "1"
        run: python -m PyInstaller autoclip.spec --noconfirm --clean
      - name: Check the binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/autoclip/autoclip"
          [ -x "$BIN" ] || BIN="dist/autoclip/autoclip.exe"
          rm -rf build-check.json build-run.json build-out build-check.mp4
          "$BIN" --help
          "$BIN" --init build-check.json
          # a real run: three seconds of video in, one clip out.
          # Generate it with the ffmpeg MoviePy encodes with: the runners have no system ffmpeg.
          FFMPEG="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -y -v error -f lavfi -i testsrc2=s=320x180:r=15:d=3 -f lavfi -i sine=frequency=220:duration=3 \
            -pix_fmt yuv420p -c:v libx264 -c:a aac -shortest build-check.mp4
          # one short clip via the 4.0 file schema (ranges, lowest quality, captions off);
          # a 3-second clip cannot satisfy the 20 s default minimum of a highlights pick
          cat > build-run.json <<JSON
          {
            "input": ["build-check.mp4"],
            "clips": {"preset": "shorts", "scenes": "best", "ranges": ["00:00:00-00:00:03"]}
          }
          JSON
          "$BIN" --output-dir build-out --quality lowest --skip caption,title,llm build-run.json
          ls build-out/short/build-check/*.mp4
      - name: Check the frozen server serves the pages
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/autoclip/autoclip"
          [ -x "$BIN" ] || BIN="dist/autoclip/autoclip.exe"
          PORT=8123
          # the first launch of a PyInstaller folder can take a while on a cold runner
          "$BIN" serve --host 127.0.0.1 --port "$PORT" >server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:$PORT/view/" >/dev/null 2>&1; then
              echo "the frozen server serves /view/"
              exit 0
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error file=autoclip.spec::the frozen server exited before answering /view/"
              cat server.log
              exit 1
            fi
            sleep 1
          done
          echo "::error file=autoclip.spec::the frozen server did not answer /view/ within 60 s"
          cat server.log
          exit 1
      - name: Build the AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p packages
          case "$(uname -m)" in
            x86_64) TOOL=appimagetool-x86_64.AppImage ;;
            aarch64) TOOL=appimagetool-aarch64.AppImage ;;
            *) echo "unknown architecture: $(uname -m)"; exit 1 ;;
          esac
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/$TOOL"
          chmod +x appimagetool
          python tools/make_appimage.py --dist dist/autoclip --out "packages/autoclip-$(uname -m).AppImage" \
            --appdir build/autoclip.AppDir --tool ./appimagetool
          # it runs without FUSE when extracted, so check it here too
          APPIMAGE_EXTRACT_AND_RUN=1 "packages/autoclip-$(uname -m).AppImage" --help
      - name: Build the snap (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if ! sudo snap install snapcraft --classic 2>&1 | tee snap-install.log; then
            echo "::warning::snap install snapcraft failed; continuing without snap"
          fi
          if ! command -v snapcraft >/dev/null 2>&1; then
            echo "::warning::snapcraft unavailable; skipping snap build"
            exit 0
          fi
          snapcraft --version
          # the version of the snap is the version of the package
          VERSION="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          sed -i "s/^version: .*/version: \"$VERSION\"/" snapcraft.yaml
          # Destructive mode installs the extension's content snaps on the host
          if ! sudo "$(command -v snapcraft)" --destructive-mode 2>&1 | tee snapcraft.log; then
            ERRORS="$(grep -iE 'error|failed|cannot' snapcraft.log | tail -n 3 | tr '\n' ' ' | cut -c1-800 || true)"
            echo "::warning file=snapcraft.yaml::snapcraft failed: ${ERRORS:-see the log}; continuing without .snap"
            exit 0
          fi
          mkdir -p packages
          shopt -s nullglob
          mv ./*.snap packages/ 2>/dev/null || true
          ls -la packages/*.snap 2>/dev/null || true
      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # the contents of dist/ land at the artifact root: autoclip/ with the binary inside
          path: dist
          if-no-files-found: error
          retention-days: 30
      - name: Upload the Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-packages
          path: packages
          if-no-files-found: error
          retention-days: 30

  release:
    name: release
    needs: [check, build]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the release files
        run: |
          set -euo pipefail
          mkdir -p release
          here="$PWD/release"
          for dir in artifacts/*; do
            name="$(basename "$dir")"
            case "$name" in
              *-packages)
                cp "$dir"/* "$here"/
                ;;
              *-windows-*)
                # install.ps1 downloads autoclip-windows-x64.zip
                (cd "$dir" && zip -qr "$here/$name.zip" autoclip)
                ;;
              *)
                # install.sh downloads autoclip-<target>.tar.gz
                (cd "$dir" && tar -czf "$here/$name.tar.gz" autoclip)
                ;;
            esac
          done
          # both installers verify the archive against SHA256SUMS; ship the scripts themselves too
          cp install.sh install.ps1 "$here"/
          (cd "$here" && for f in *.tar.gz *.zip *.AppImage *.snap install.sh install.ps1; do [ -e "$f" ] && sha256sum "$f"; done > SHA256SUMS)
          ls -la release
      - name: Attest the release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          # this job has no checkout, so tell gh which repository to use
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v${{ needs.check.outputs.version }}"
          # a draft makes the upload all-or-nothing: a failed upload leaves a draft, not a half release
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --generate-notes --title "$TAG"
          fi
          gh release upload "$TAG" release/* --clobber
          gh release edit "$TAG" --draft=false

  installers:
    name: installers-${{ matrix.name }}
    needs: [check, build]
    if: needs.check.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            artifact: autoclip-linux-x64
            target: linux-x64
          - name: windows-x64
            os: windows-latest
            artifact: autoclip-windows-x64
            target: windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Package, serve and run install.sh
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p serve
          # artifact uploads do not guarantee the executable bit
          chmod +x dist/autoclip/autoclip
          # install.sh extracts autoclip/ into its app folder
          tar -czf "serve/${{ matrix.artifact }}.tar.gz" -C dist autoclip
          cp install.sh serve/
          (cd serve && sha256sum "${{ matrix.artifact }}.tar.gz" > SHA256SUMS)
          # start server and wait loudly for readiness
          # (ubuntu-latest images provide python3, not necessarily a `python` alias)
          python3 -m http.server 8765 --bind 127.0.0.1 --directory serve >server.log 2>&1 &
          SERVER_PID=$!
          trap 'echo "=== server.log ==="; cat server.log 2>/dev/null || true; kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS --retry 2 --retry-connrefused "http://127.0.0.1:8765/SHA256SUMS" >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "the local asset server exited before answering"
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "asset server never came online:"
            cat server.log 2>/dev/null || true
            exit 1
          fi
          AUTOCLIP_BASE_URL="http://127.0.0.1:8765" \
            AUTOCLIP_TARGET="${{ matrix.target }}" \
            AUTOCLIP_HOME="$PWD/installed" \
            AUTOCLIP_BIN_DIR="$PWD/bin" \
            sh serve/install.sh
          "$PWD/bin/autoclip" --version
      - name: Package, serve and run install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force serve | Out-Null
          # install.ps1 extracts autoclip/ into its app folder
          Compress-Archive -Path dist/autoclip -DestinationPath "serve/${{ matrix.artifact }}.zip" -Force
          Copy-Item install.ps1 serve/
          $hash = (Get-FileHash "serve/${{ matrix.artifact }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}.zip" | Set-Content serve/SHA256SUMS -Encoding ascii
          $server = Start-Process python -ArgumentList "-m","http.server","8765","--bind","127.0.0.1","--directory","serve" -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            foreach ($attempt in 1..30) {
              try {
                Invoke-WebRequest "http://127.0.0.1:8765/SHA256SUMS" -UseBasicParsing | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) { throw "the local asset server did not start" }
            $env:AUTOCLIP_BASE_URL = "http://127.0.0.1:8765"
            $env:AUTOCLIP_HOME = Join-Path $PWD "installed"
            & ./serve/install.ps1
            $exe = Join-Path $env:AUTOCLIP_HOME "app/autoclip.exe"
            & $exe --version
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
