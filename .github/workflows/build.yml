name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "autoclip/**"
      - "frozen_entry.py"
      - "autoclip.spec"
      - ".github/workflows/build.yml"
      - "pyproject.toml"

# PyInstaller cannot cross-compile, so every target is built on a runner of that architecture:
# ubuntu-24.04-arm and windows-11-arm are the arm64 runners, macos-15 is Apple silicon and
# macos-15-intel is the x64 one (macos-13 and macos-14 are on their way out).
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            artifact: autoclip-linux-x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            artifact: autoclip-linux-arm64
          - name: macos-x64
            os: macos-15-intel
            artifact: autoclip-macos-x64
          - name: macos-arm64
            os: macos-15
            artifact: autoclip-macos-arm64
          - name: windows-x64
            os: windows-2022
            artifact: autoclip-windows-x64
          - name: windows-arm64
            os: windows-11-arm
            artifact: autoclip-windows-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pyinstaller>=6.10"
      - name: Build the standalone app
        run: python -m PyInstaller autoclip.spec --noconfirm --clean
      - name: Check the binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/autoclip/autoclip"
          [ -x "$BIN" ] || BIN="dist/autoclip/autoclip.exe"
          rm -rf build-check.json build-run.json build-out build-check.mp4
          "$BIN" --help
          "$BIN" --init build-check.json
          # a real run: three seconds of video in, one clip out
          ffmpeg -y -v error -f lavfi -i testsrc2=s=320x180:r=15:d=3 -f lavfi -i sine=frequency=220:duration=3 \
            -pix_fmt yuv420p -c:v libx264 -c:a aac -shortest build-check.mp4
          cat > build-run.json <<JSON
          {
            "input": ["build-check.mp4"],
            "output_dir": "build-out",
            "compute": {"device": "cpu"},
            "clips": {"mode": "highlights", "kinds": ["short"], "scenes": "best",
                      "short": {"count": 1, "min_seconds": 2, "max_seconds": 3, "aspect": "9:16"}},
            "transcript": {"mode": "off"},
            "video": {"short_side": 144, "fps": 15, "preset": "ultrafast", "gpu": "off", "thumbnail": false},
            "captions": {"enabled": false},
            "audio": {"enhance": false, "denoise": "none"},
            "resources": {"max_workers": 1},
            "logging": {"enabled": true, "console_level": "INFO"}
          }
          JSON
          "$BIN" build-run.json
          ls build-out/short/build-check/*.mp4
      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/autoclip
          if-no-files-found: error
          retention-days: 30

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach the builds to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* --generate-notes --title "${{ github.ref_name }}"
