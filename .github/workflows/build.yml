name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "autoclip/**"
      - "tools/**"
      - "assets/**"
      - "autoclip.spec"
      - "snapcraft.yaml"
      - ".github/workflows/build.yml"
      - "pyproject.toml"

# PyInstaller cannot cross-compile, so every target is built on a runner of that architecture:
# ubuntu-24.04-arm and macos-15 are the arm64 runners and macos-15-intel is the x64 one
# (macos-13 and macos-14 are on their way out). Windows on ARM is not built: ctranslate2
# (faster-whisper) publishes no win-arm64 wheels and opencv has none either.
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            artifact: autoclip-linux-x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            artifact: autoclip-linux-arm64
          - name: macos-x64
            os: macos-15-intel
            artifact: autoclip-macos-x64
          - name: macos-arm64
            os: macos-15
            artifact: autoclip-macos-arm64
          - name: windows-x64
            os: windows-2022
            artifact: autoclip-windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pyinstaller>=6.10"
      - name: Build the standalone app
        run: python -m PyInstaller autoclip.spec --noconfirm --clean
      - name: Check the binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/autoclip/autoclip"
          [ -x "$BIN" ] || BIN="dist/autoclip/autoclip.exe"
          rm -rf build-check.json build-run.json build-out build-check.mp4
          "$BIN" --help
          "$BIN" --init build-check.json
          # a real run: three seconds of video in, one clip out.
          # Generate it with the ffmpeg MoviePy encodes with: the runners have no system ffmpeg.
          FFMPEG="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -y -v error -f lavfi -i testsrc2=s=320x180:r=15:d=3 -f lavfi -i sine=frequency=220:duration=3 \
            -pix_fmt yuv420p -c:v libx264 -c:a aac -shortest build-check.mp4
          cat > build-run.json <<JSON
          {
            "input": ["build-check.mp4"],
            "output_dir": "build-out",
            "compute": {"device": "cpu"},
            "clips": {"mode": "highlights", "kinds": ["short"], "scenes": "best",
                      "short": {"count": 1, "min_seconds": 2, "max_seconds": 3, "aspect": "9:16"}},
            "transcript": {"mode": "off"},
            "video": {"short_side": 144, "fps": 15, "preset": "ultrafast", "gpu": "off", "thumbnail": false},
            "captions": {"enabled": false},
            "audio": {"enhance": false, "denoise": "none"},
            "resources": {"max_workers": 1},
            "logging": {"enabled": true, "console_level": "INFO"}
          }
          JSON
          "$BIN" build-run.json
          ls build-out/short/build-check/*.mp4
      - name: Build the AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) TOOL=appimagetool-x86_64.AppImage ;;
            aarch64) TOOL=appimagetool-aarch64.AppImage ;;
            *) echo "unknown architecture: $(uname -m)"; exit 1 ;;
          esac
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/$TOOL"
          chmod +x appimagetool
          python tools/make_appimage.py --dist dist/autoclip --out "dist/autoclip-$(uname -m).AppImage" \
            --appdir build/autoclip.AppDir --tool ./appimagetool
          # it runs without FUSE when extracted, so check it here too
          APPIMAGE_EXTRACT_AND_RUN=1 "dist/autoclip-$(uname -m).AppImage" --help
      - name: Build the snap (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo snap install snapcraft --classic
          # the version of the snap is the version of the package
          VERSION="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          sed -i "s/^version: .*/version: \"$VERSION\"/" snapcraft.yaml
          snapcraft --destructive-mode
          ls -la ./*.snap
      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/autoclip
          if-no-files-found: error
          retention-days: 30
      - name: Upload the Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-packages
          path: |
            dist/*.AppImage
            ./*.snap
          if-no-files-found: error
          retention-days: 30

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the release files
        run: |
          set -euo pipefail
          mkdir -p release
          here="$PWD/release"
          for dir in artifacts/*; do
            name="$(basename "$dir")"
            case "$name" in
              *-packages)
                cp "$dir"/* "$here"/
                ;;
              *)
                # unzipping gives autoclip/ with the binary inside - the layout of dist/
                (cd "$dir" && zip -qr "$here/$name.zip" autoclip)
                ;;
            esac
          done
          ls -la release
      - name: Attach the builds to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" release/* --generate-notes --title "${{ github.ref_name }}"
