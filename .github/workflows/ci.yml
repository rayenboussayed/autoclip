name: ci

permissions:
  contents: read

on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy autoclip tests tools
      # the desktop app tests need a display: a virtual one on Linux (macOS and Windows have one)
      - name: Install a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # pytest enforces >= 95% branch coverage (see pyproject.toml); spawned workers are measured too
      - name: Test
        if: runner.os != 'Linux'
        run: pytest
      - name: Test (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest
      - name: Re-run with the security-patched Pillow (MoviePy's own pin is merely conservative)
        if: runner.os != 'Linux'
        run: pip install "Pillow>=12.3" && pytest
      - name: Re-run with the security-patched Pillow (virtual display)
        if: runner.os == 'Linux'
        run: pip install "Pillow>=12.3" && xvfb-run -a pytest
