name: ci

permissions:
  contents: read

on:
  # non-main branches get the matrix; main gets it through build.yml (which also builds and gates the release)
  push:
    branches-ignore: [main]
  workflow_call:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      # No step is ever skipped: everything runs even after a failure so nothing fails silently.
      - uses: actions/checkout@v4
        if: always()
      - uses: actions/setup-python@v5
        if: always()
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package
        if: always()
        run: pip install -e ".[dev]"
      - name: Lint
        if: always()
        run: ruff check . && ruff format --check .
      - name: Type-check
        if: always()
        run: mypy autoclip tests tools
      - name: Dead code and dependency hygiene
        if: always()
        run: vulture && deptry .
      # The desktop app tests need a display; Linux uses a virtual one (macOS and Windows have one).
      - name: Install a virtual display
        if: always()
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y xvfb
          else
            echo "no virtual display needed on ${{ runner.os }}; using the runner's own display"
          fi
      # pytest enforces 100% branch coverage (see pyproject.toml); spawned workers are measured too
      - name: Test
        if: always()
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a pytest
          else
            pytest
          fi
      - name: Re-run with the security-patched Pillow (MoviePy's own pin is merely conservative)
        if: always()
        shell: bash
        run: |
          pip install "Pillow>=12.3"
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a pytest
          else
            pytest
          fi
      - name: Print the coverage gaps (on failure)
        if: failure()
        shell: bash
        run: |
          # one pass: the table shows in the log and the awk emits ::error lines for non-100% rows
          python -m coverage report --show-missing | awk '{ print } $6 ~ /%/ && $6 != "100.00%" { print "::error file=" $1 "::coverage gap: " $0 }' || true
          [ -f .coverage ] || echo "::error file=coverage.json::no .coverage data file - pytest died before pytest-cov could combine; nothing was measured"
      - name: Diagnose the pipeline environment (on failure)
        if: failure()
        shell: bash
        run: |
          echo "::error file=ci.log::ffmpeg_exe=$(python -c 'from autoclip.core.media import ffmpeg_exe; print(ffmpeg_exe())' 2>&1 | tail -1)" || true
          echo "::error file=ci.log::curl=$(which curl ffmpeg 2>&1 | tr '\n' ' ') ffmpeg-version=$(python -c 'import subprocess; from autoclip.core.media import ffmpeg_exe; r=subprocess.run([ffmpeg_exe(), "-version"], capture_output=True, text=True, timeout=60); print("exit", r.returncode, "out", r.stdout.splitlines()[0] if r.stdout else "", "err", r.stderr.splitlines()[-1] if r.stderr else "")' 2>&1 | tail -1)" || true
          echo "::error file=ci.log::witnesses=$(python -c 'import shutil, sys; print("python", sys.version.split("[")[0].strip(), "which-ffmpeg=", shutil.which("ffmpeg"))' 2>&1)" || true
      - name: "Diagnose a real pipeline run (on failure)"
        if: failure()
        shell: bash
        run: |
          set +e
          ffmpeg="$(python -c 'from autoclip.core.media import ffmpeg_exe; print(ffmpeg_exe())' 2>/dev/null | tail -1)"
          "$ffmpeg" -y -v error -f lavfi -i testsrc2=s=320x180:r=15:d=5 -f lavfi -i sine=frequency=220:duration=5 -pix_fmt yuv420p -c:v libx264 -c:a aac -shortest diag-src.mp4
          python - <<'PY2'
          with open("diag.srt", "w", encoding="utf-8") as fh:
              fh.write("1\n00:00:00,000 --> 00:00:02,000\none sentence is here.\n2\n00:00:02,000 --> 00:00:04,000\ntwo sentences are here.\n3\n00:00:04,000 --> 00:00:05,000\nthe end is here.\n")
          PY2
          python -m autoclip --init diag.json >/dev/null 2>&1
          python - <<'PY'
          import json
          p = json.load(open("diag.json"))
          p["input"] = ["diag-src.mp4"]
          p.setdefault("clips", {})["ranges"] = ["0-4"]
          p["clips"]["preset"] = "shorts"
          p["clips"]["scenes"] = "best"
          json.dump(p, open("diag.json", "w"))
          PY
          python -m autoclip --output-dir diag-out --quality lowest --skip caption,title,llm diag.json > diag-out.log 2>&1
          echo "::error file=ci.log::diag exit=$? clips=$(ls diag-out/short/diag-src/*.mp4 2>/dev/null | wc -l) log-tail=$(tail -25 diag-out.log | tr '\n' '|')"
