[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoclip"
version = "3.0.3"
description = "Cut long videos into the best short clips (TikTok / Reels / Shorts). Free, local, cross-platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26", "psutil>=5.9", "av>=12", "moviepy>=2.1,<3", "Pillow>=10.1", "opencv-python-headless>=4.8",
    "fonttools>=4.40", "faster-whisper>=1.1", "arabic-reshaper>=3.0", "python-bidi>=0.4.2", "pydantic>=2.14,<3",
    "yt-dlp[default]>=2026.10.21",
]

[project.optional-dependencies]
gui = ["tkinterdnd2>=0.7"]
denoise = ["noisereduce>=3.0"]
enhance = ["sherpa-onnx>=1.13,<2"]
scenes = ["scenedetect[opencv]>=0.7"]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9", "pydantic-settings>=2.4", "opentelemetry-api>=1.26", "opentelemetry-sdk>=1.26", "opentelemetry-instrumentation-fastapi>=0.47b0", "opentelemetry-exporter-otlp>=1.26", "aiofiles>=23"]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.8", "ruff>=0.5", "noisereduce>=3.0", "sherpa-onnx>=1.13,<2", "scenedetect[opencv]>=0.7", "fastapi>=0.115", "uvicorn[standard]>=0.30", "websockets>=12", "jinja2>=3.1", "python-multipart>=0.0.9", "pydantic-settings>=2.4", "opentelemetry-api>=1.26", "opentelemetry-sdk>=1.26", "opentelemetry-instrumentation-fastapi>=0.47b0", "opentelemetry-exporter-otlp>=1.26", "aiofiles>=23", "httpx>=0.27", "tkinterdnd2>=0.7"]

[project.scripts]
autoclip = "autoclip.cli:main"

[tool.setuptools]
packages = ["autoclip", "autoclip.core", "autoclip.cli", "autoclip.app", "autoclip.server", "autoclip.server.routers"]

[tool.setuptools.package-data]
"autoclip.server" = ["templates/*.html"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF", "PL"]
ignore = ["S101", "S603", "PLR0913", "PLR0917", "PLR0911", "PLR0912", "PLR0915", "PLR2004", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "RUF", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: talks to the real internet (skipped unless AUTOCLIP_NETWORK_TESTS=1 or AUTOCLIP_E2E_TESTS=1)",
    "e2e: runs the command line against real URLs or starts the local server (skipped unless AUTOCLIP_E2E_TESTS=1)",
]
# Capture at the Python level, not the fd level: pytest's default fd capture replaces the standard OS
# handles, and on Windows that intermittently breaks Tcl's file-channel reads ("couldn't read file
# .../init.tcl: No error"), failing the desktop-app tests at random. Nothing here asserts on output
# written straight to a file descriptor, so sys capture loses nothing.
addopts = "-q --capture=sys --cov=autoclip --cov-report=term-missing --cov-fail-under=95"
filterwarnings = [
  "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:moviepy.video.io.ffmpeg_reader",
  "error::DeprecationWarning:autoclip",
]

[tool.coverage.run]
branch = true
concurrency = ["multiprocessing", "thread"]
parallel = true
sigterm = true

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
