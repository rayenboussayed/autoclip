[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoclip"
version = "2.1.0"
description = "Cut long videos into the best short clips (TikTok / Reels / Shorts). Free, local, cross-platform."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26", "psutil>=5.9", "av>=12", "moviepy>=2.1,<3", "Pillow>=10.1", "opencv-python-headless>=4.8",
    "fonttools>=4.40", "faster-whisper>=1.1", "arabic-reshaper>=3.0", "python-bidi>=0.4.2",
]

[project.optional-dependencies]
denoise = ["noisereduce>=3.0"]
enhance = ["sherpa-onnx>=1.13"]
scenes = ["scenedetect[opencv]>=0.7"]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.8", "ruff>=0.5", "noisereduce>=3.0", "sherpa-onnx>=1.13", "scenedetect[opencv]>=0.7"]

[project.scripts]
autoclip = "autoclip.cli:main"

[tool.setuptools]
packages = ["autoclip"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF", "PL"]
ignore = ["S101", "S603", "PLR0913", "PLR0917", "PLR0911", "PLR0912", "PLR0915", "PLR2004", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PLR", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=autoclip --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
branch = true
concurrency = ["multiprocessing", "thread"]
parallel = true
sigterm = true

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
